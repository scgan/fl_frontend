server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;

    index index.html index.htm index.nginx-debian.html;
    client_max_body_size 2000M;
    server_name _;

    # PDF.js 的模块 Worker 必须以 JavaScript 类型返回；旧 Nginx MIME 表可能不含 mjs。
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    location /api {
        proxy_pass http://10.222.9.151:9502/;
        proxy_set_header Host $http_host;
        proxy_cookie_path /api /;
        proxy_cookie_domain localhost:80 http://10.222.9.151:9502/;

        # 添加超时配置解决504问题
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # 新增：关闭代理缓冲，让 SSE 流式传输正常
        proxy_buffering off;
        proxy_cache off;

        # 新增：SSE 流式传输优化配置
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 禁用响应缓冲，确保实时传输
        proxy_request_buffering off;
        tcp_nodelay on;

        # 设置较小的缓冲区大小
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 正式研究服务使用 18001，与上方 9502 共用生产库；18000 属于 dev，不能混用文献 ID。
    location /research-api/ {
        proxy_pass http://10.222.9.151:18001/api/v1/;
        proxy_set_header Host $http_host;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        proxy_request_buffering off;
        tcp_nodelay on;
    }
}
