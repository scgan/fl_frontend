server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;

    index index.html index.htm index.nginx-debian.html;
    client_max_body_size 2000M;
    server_name _;

    # PDF.js 的模块 Worker 必须以 JavaScript 类型返回；旧 Nginx MIME 表可能不含 mjs。
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    # 重建容器后通过 Docker DNS 更新后端地址。
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /research-api/ {
        set $research_upstream ForeignResearchAgent-dev:18000;
        rewrite ^/research-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://$research_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $backend_upstream ForeignBackend-dev:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;

        # 添加超时配置解决504问题
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # 新增：关闭代理缓冲，让 SSE 流式传输正常
        proxy_buffering off;
        proxy_cache off;

        # 新增：SSE 流式传输优化配置
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 禁用响应缓冲，确保实时传输
        proxy_request_buffering off;
        tcp_nodelay on;

        # 设置较小的缓冲区大小
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}
